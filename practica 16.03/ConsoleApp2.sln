namespace ConsoleApp2
{
    internal class Program
    {
        static void Main(string[] args)
        {
            Cat cat1 = new Cat(2);
            cat1.Method1(); cat1.Method2(); cat1.Method3();
            Animal cat2 = new Cat(2);
            //method cat 1
           // method cat 2
            //method cat 3
            cat2.Method1(); cat2.Method2(); cat2.Method3();
            //animal method 2
            //method cat 2
            //method cat 3
        }
    }
    public abstract class Animal
    {
        private int _number;
        public abstract string Word { get; } // абстрактное свойство 

        //public virtual string Word => "hi"; // виртуальное свойство 
        public Animal(int number)
        {
            _number = number;
        }
        public void Method1() // обычный миетод базового класса
        {
            Console.WriteLine("animal method 2");
        }
        public virtual void Method2() // виртуальный метод базового класска, можно переопределять и не переопределять с наследниках
        {
            Console.WriteLine("animal method 2");
        }
        // никакого тела не пишем в абстрактном методе но в наследних обязателен этот метод
        public abstract void Method3(); // абстрактный метод базового класска 
        

    }
    // здесь пытаемся все переопределеить
    public class Cat: Animal
    {
        public override string Word => "byyyye"; // переопределяем абстрактное свойство  override - обязательно
        public Cat(int number): base(number)
        {

        }
        public new void Method1() // скрыли обычный  метод
        {
            Console.WriteLine("method cat 1");
        }
        public override void Method2()// переопределили виртуальный метод
        {
            Console.WriteLine("method cat 2");
        }
        public override void Method3() //переопрделили абстрактный метод
        {
            Console.WriteLine("method cat 3");
        }
    }





























